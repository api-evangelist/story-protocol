name: Story Protocol
description: >-
  Story Protocol is a purpose-built EVM Layer 1 blockchain for onchain
  intellectual property (the "IP blockchain"), powered by Proof of Creativity,
  built by Pip Labs and backed by a16z. Its public REST API (api.storyapis.com)
  is a read-only indexer that exposes IP assets, collections, license terms,
  license templates and tokens, minting fees, disputes, IP groups, royalties,
  protocol modules, permissions, and transactions across Story mainnet (chain
  1514) and the Aeneid testnet (chain 1315). Authentication is an X-Api-Key
  header plus an X-Chain network selector; official TypeScript and Python SDKs
  wrap both the API and the onchain protocol.
